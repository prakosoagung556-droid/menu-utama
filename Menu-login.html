<!DOCTYPE html>
<html lang="id"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard Admin</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="dashboard">

    <nav class="navbar">

        <div class="brand">
            ADMIN PANEL
        </div>

        <div class="user-area">

            <span>
                👤
                <strong sec:authentication="name"></strong>
            </span>

            <form th:action="@{/logout}"
                  method="post">

                <button type="submit"
                        class="btn-logout">

                    Logout

                </button>

            </form>

        </div>

    </nav>


    <main class="content">

        <h1>Dashboard</h1>

        <p>
            Selamat datang di halaman administrator.
        </p>


        <div class="cards">

            <div class="card">

                <div class="card-icon">
                    👨‍💼
                </div>

                <h3>Admin</h3>

                <p>
                    Sistem Login Admin
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    🔒
                </div>

                <h3>Security</h3>

                <p>
                    Spring Security aktif
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    🗄️
                </div>

                <h3>Database</h3>

                <p>
                    MySQL terhubung
                </p>

            </div>

        </div>

    </main>

</div>

</body>
</html>
